---
name: ascm
title: "Augmented Synthetic Control"
jas: '1.2'
version: '1.0.0'
menuGroup: SCM
menuTitle: "Augmented Synthetic Control"
menuSubtitle: "Ben-Michael et al. (2021)"

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: unit
      title: Unit
      type: Variable
      permitted:
          - factor
          - id

    - name: time
      title: Time
      type: Variable
      permitted:
          - numeric
          - factor
          - id

    - name: predictors
      title: Covariates (optional)
      type: Variables
      permitted:
          - numeric
      description: Auxiliary covariates, averaged over the pre-treatment periods (missing values omitted), as in the augsynth package.

    - name: treatedUnit
      title: Treated unit
      type: Level
      variable: (unit)

    - name: extraTreated
      title: Additional treated units (comma-separated)
      type: String
      default: ""
      description: Further units treated in the same first period; their outcomes are averaged with the treated unit.

    - name: treatmentTime
      title: First treated period
      type: Number
      default: 2000
      min: 0

    - name: donorExclude
      title: Exclude donors (comma-separated)
      type: String
      default: ""

    - name: progfunc
      title: Outcome model
      type: List
      options:
          - name: ridge
            title: Ridge augmentation
          - name: none
            title: None (synthetic control only)
      default: ridge

    - name: scm
      title: Use synthetic control weights
      type: Bool
      default: true

    - name: fixedeff
      title: Unit fixed effects (demean by pre-treatment mean)
      type: Bool
      default: false

    - name: residualize
      title: Residualize covariates (instead of balancing them)
      type: Bool
      default: false

    - name: lambdaText
      title: Ridge penalty (blank = cross-validation)
      type: String
      default: ""

    - name: min1se
      title: Largest lambda within one SE of the CV minimum
      type: Bool
      default: true

    - name: infType
      title: Inference
      type: List
      options:
          - name: conformal
            title: Conformal
          - name: jackknife+
            title: Time jackknife+
          - name: jackknife
            title: Jackknife (leave one unit out)
          - name: none
            title: None
      default: conformal

    - name: alpha
      title: Significance level
      type: Number
      default: 0.05
      min: 0.001
      max: 0.5

    - name: conformalType
      title: Conformal permutations
      type: List
      options:
          - name: iid
            title: iid (random)
          - name: block
            title: Moving block
      default: iid

    - name: nPerm
      title: Random permutations (iid)
      type: Integer
      default: 1000
      min: 10

    - name: gridSize
      title: Grid size for intervals
      type: Integer
      default: 50
      min: 5

    - name: seed
      title: Random seed
      type: Integer
      default: 1
      min: 1

    - name: showPath
      title: Period-by-period path table
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

    - name: showHelp
      title: Method notes
      type: Bool
      default: false
...
