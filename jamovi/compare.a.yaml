---
name: compare
title: "Compare Estimators"
jas: '1.2'
version: '1.0.0'
menuGroup: SCM
menuTitle: "Compare Estimators"
menuSubtitle: "Side-by-side results"

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: unit
      title: Unit
      type: Variable
      permitted:
          - factor
          - id

    - name: time
      title: Time
      type: Variable
      permitted:
          - numeric
          - factor
          - id

    - name: treatedUnit
      title: Treated unit
      type: Level
      variable: (unit)

    - name: treatmentTime
      title: First treated period
      type: Number
      default: 2000
      min: 0

    - name: donorExclude
      title: Exclude donors (comma-separated)
      type: String
      default: ""

    - name: cmpScm
      title: Synthetic Control (classic)
      type: Bool
      default: true

    - name: cmpPen
      title: Penalized
      type: Bool
      default: false

    - name: cmpDem
      title: Demeaned
      type: Bool
      default: true

    - name: cmpAscm
      title: Augmented (ridge)
      type: Bool
      default: true

    - name: cmpEnet
      title: Elastic-Net
      type: Bool
      default: false

    - name: cmpBscm
      title: Bayesian
      type: Bool
      default: false

    - name: cmpIfe
      title: Interactive Fixed Effects
      type: Bool
      default: false

    - name: cmpMc
      title: Matrix Completion
      type: Bool
      default: false

    - name: cmpSdid
      title: SDID
      type: Bool
      default: true

    - name: inference
      title: Add each method's own uncertainty measure
      type: Bool
      default: false

    - name: lambda
      title: Penalized, penalty lambda
      type: Number
      default: 0.01
      min: 0

    - name: nFactors
      title: Interactive fixed effects, number of factors
      type: Integer
      default: 1
      min: 1

    - name: mcLambda
      title: Matrix completion, nuclear-norm penalty (relative)
      type: Number
      default: 0.1
      min: 0.0001
      max: 1

    - name: bayesDraws
      title: Bayesian, posterior draws
      type: Integer
      default: 1000
      min: 200

    - name: optStarts
      title: Synthetic control, random starts
      type: Integer
      default: 5
      min: 1

    - name: seed
      title: Random seed
      type: Integer
      default: 1

    - name: showPath
      title: Period-by-period table
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

    - name: showHelp
      title: Method notes
      type: Bool
      default: false
