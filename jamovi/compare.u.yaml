name: compare
title: "Compare Estimators"
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Unit
            children:
                - type: VariablesListBox
                  name: unit
                  isTarget: true
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Time
            children:
                - type: VariablesListBox
                  name: time
                  isTarget: true
                  maxItemCount: 1
    - type: LevelSelector
      name: treatedUnit
      label: Treated unit
    - type: TextBox
      name: treatmentTime
      label: First treated period
      format: number
    - type: TextBox
      name: donorExclude
      label: Exclude donors
      format: string
    - type: CollapseBox
      label: Methods to compare
      collapsed: true
      children:
          - type: CheckBox
            name: cmpScm
          - type: CheckBox
            name: cmpPen
          - type: CheckBox
            name: cmpDem
          - type: CheckBox
            name: cmpAscm
          - type: CheckBox
            name: cmpEnet
          - type: CheckBox
            name: cmpBscm
          - type: CheckBox
            name: cmpIfe
          - type: CheckBox
            name: cmpMc
          - type: CheckBox
            name: cmpSdid
    - type: CollapseBox
      label: Method settings
      collapsed: true
      children:
          - type: TextBox
            name: lambda
            format: number
          - type: TextBox
            name: nFactors
            format: number
          - type: TextBox
            name: mcLambda
            format: number
          - type: TextBox
            name: bayesDraws
            format: number
          - type: TextBox
            name: optStarts
            format: number
          - type: TextBox
            name: seed
            format: number
    - type: CollapseBox
      label: Inference
      collapsed: true
      children:
          - type: CheckBox
            name: inference
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
          - type: CheckBox
            name: showPath
