---
name: sdid
title: "Synthetic Difference-in-Differences"
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Method
      type: Html
      visible: (outcome)

    - name: summary
      title: Estimate
      type: Table
      visible: (outcome)
      refs:
          - arkhangelsky2021
          - synthdid
      columns:
          - name: metric
            title: Metric
            type: text
          - name: value
            title: Value
            type: number
            format: dp:3

    - name: weights
      title: Unit weights (omega)
      type: Table
      visible: (outcome)
      columns:
          - name: unit
            title: Control unit
            type: text
          - name: weight
            title: Weight
            type: number
            format: dp:4

    - name: timeWeights
      title: Time weights (lambda)
      type: Table
      visible: (outcome)
      columns:
          - name: time
            title: Pre-treatment period
            type: text
          - name: weight
            title: Weight
            type: number
            format: dp:4

    - name: covCoef
      title: Covariate coefficients
      type: Table
      visible: (predictors)
      columns:
          - name: covariate
            title: Covariate
            type: text
          - name: estimate
            title: Estimate
            type: number
            format: dp:4

    - name: effectCurve
      title: Effect curve (post-treatment periods)
      type: Table
      visible: (outcome)
      columns:
          - name: time
            title: Time
            type: text
          - name: effect
            title: Effect
            type: number
            format: dp:3

    - name: pathTable
      title: Period-by-period path
      type: Table
      visible: (showPath)
      columns:
          - name: time
            title: Time
            type: text
          - name: treated
            title: Treated (average)
            type: number
            format: dp:3
          - name: synthetic
            title: Counterfactual
            type: number
            format: dp:3
          - name: gap
            title: Gap
            type: number
            format: dp:3

    - name: pathsPlot
      title: Treated vs counterfactual
      type: Image
      width: 600
      height: 400
      renderFun: .plotPaths
      visible: (outcome)

    - name: gapsPlot
      title: Gap between treated and counterfactual
      type: Image
      width: 600
      height: 400
      renderFun: .plotGaps
      visible: (outcome)
...
