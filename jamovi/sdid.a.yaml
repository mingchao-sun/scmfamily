---
name: sdid
title: "Synthetic Difference-in-Differences"
jas: '1.2'
version: '1.0.0'
menuGroup: SCM
menuTitle: "Synthetic Difference-in-Differences"
menuSubtitle: "Arkhangelsky et al. (2021)"

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: unit
      title: Unit
      type: Variable
      permitted:
          - factor
          - id

    - name: time
      title: Time
      type: Variable
      permitted:
          - numeric
          - factor
          - id

    - name: predictors
      title: Covariates (optional)
      type: Variables
      permitted:
          - numeric
      description: Time-varying covariates partialled out of the outcome with common coefficients, estimated jointly with the unit and time weights (must be observed in every period and unaffected by the treatment).

    - name: treatedUnit
      title: Treated unit
      type: Level
      variable: (unit)

    - name: extraTreated
      title: Additional treated units (comma-separated)
      type: String
      default: ""
      description: Further units treated in the same first period. The estimator needs simultaneous adoption.

    - name: treatmentTime
      title: First treated period
      type: Number
      default: 2000
      min: 0

    - name: donorExclude
      title: Exclude donors (comma-separated)
      type: String
      default: ""

    - name: estimator
      title: Estimator
      type: List
      options:
          - name: sdid
            title: Synthetic difference-in-differences
          - name: sc
            title: Synthetic control
          - name: did
            title: Difference-in-differences
      default: sdid

    - name: seMethod
      title: Standard error
      type: List
      options:
          - name: placebo
            title: Placebo (Algorithm 4)
          - name: bootstrap
            title: Bootstrap (Algorithm 2)
          - name: jackknife
            title: Jackknife (Algorithm 3)
          - name: none
            title: None
      default: placebo

    - name: seReps
      title: Replications (placebo and bootstrap)
      type: Integer
      default: 200
      min: 2

    - name: seed
      title: Random seed
      type: Integer
      default: 1
      min: 1

    - name: showPath
      title: Period-by-period table
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

    - name: showHelp
      title: Method notes
      type: Bool
      default: false
...
