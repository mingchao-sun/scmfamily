---
name: stagascm
title: "Staggered-Adoption Augmented Synthetic Control"
jas: '1.2'
version: '1.0.0'
menuGroup: SCM
menuTitle: "Staggered Augmented SC"
menuSubtitle: "Ben-Michael et al. (2022)"

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: unit
      title: Unit
      type: Variable
      permitted:
          - factor
          - id

    - name: time
      title: Time
      type: Variable
      permitted:
          - numeric
          - factor
          - id

    - name: treatInd
      title: Treatment indicator (1 = treated, 0 = not)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: adoption
      title: First treated period (optional, blank for never-treated)
      type: Variable
      permitted:
          - numeric

    - name: predictors
      title: Covariates (optional)
      type: Variables
      permitted:
          - numeric
      description: Auxiliary covariates, averaged over the periods before the earliest adoption (missing values omitted), balanced together with the pre-treatment outcomes.

    - name: fixedeff
      title: Unit fixed effects
      type: Bool
      default: true

    - name: timeCohort
      title: Aggregate units by adoption time (time cohorts)
      type: Bool
      default: false

    - name: nuText
      title: Pooling parameter nu (blank = automatic)
      type: String
      default: ""
      description: Weight on the pooled balance relative to separate balance. 0 fits each treated unit separately, 1 only balances the average.

    - name: lambda
      title: Ridge penalty on weights
      type: Number
      default: 0
      min: 0

    - name: nLeads
      title: Post-treatment periods to estimate (blank = all)
      type: String
      default: ""

    - name: nLags
      title: Pre-treatment periods to balance (blank = all)
      type: String
      default: ""

    - name: infType
      title: Inference
      type: List
      options:
          - name: bootstrap
            title: Wild bootstrap
          - name: jackknife
            title: Jackknife (leave one unit out)
          - name: none
            title: None
      default: bootstrap

    - name: nBoot
      title: Bootstrap replications
      type: Integer
      default: 1000
      min: 10

    - name: alpha
      title: Significance level
      type: Number
      default: 0.05
      min: 0.001
      max: 0.5

    - name: seed
      title: Random seed
      type: Integer
      default: 1
      min: 1

    - name: showWeights
      title: Donor weights table
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

    - name: showHelp
      title: Method notes
      type: Bool
      default: false
...
